name: Debian 13 Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'debian/modules/transaction.sh'
      - 'tests/integration/**'
      - '.github/workflows/integration.yml'

permissions:
  contents: read

jobs:
  debian13:
    runs-on: ubuntu-latest
    container:
      image: debian:13
      options: --privileged
    steps:
      - name: Install integration prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git systemd systemd-sysv
      - uses: actions/checkout@v4
      - name: Syntax check integration tests
        run: bash -n tests/integration/*.sh
      - name: Run Debian 13 integration tests
        run: |
          printf 'NOTE: systemd PID 1 availability depends on the CI container runtime.\n'
          bash tests/integration.sh
