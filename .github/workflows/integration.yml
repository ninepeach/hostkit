name: Debian 13 Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'debian/modules/transaction.sh'
      - 'debian/modules/nftables.sh'
      - 'debian/modules/forwarding.sh'
      - 'debian/modules/dnsmasq.sh'
      - 'debian/modules/networkd.sh'
      - 'debian/modules/nat.sh'
      - 'debian/modules/router-firewall.sh'
      - 'debian/modules/network.sh'
      - 'tests/integration/**'
      - '.github/workflows/integration.yml'

permissions:
  contents: read

jobs:
  debian13:
    runs-on: ubuntu-latest
    container:
      image: debian:13
      options: --privileged
    steps:
      - name: Install integration prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends             git systemd systemd-sysv nftables dnsmasq procps iproute2 iputils-ping tcpdump
      - uses: actions/checkout@v4
      - name: Syntax check integration tests
        run: bash -n tests/integration/*.sh
      - name: Run Debian 13 integration tests
        run: |
          printf 'NOTE: tests requiring unavailable kernel capabilities or systemd PID 1 must report SKIP, never PASS.\n'
          bash tests/integration.sh
